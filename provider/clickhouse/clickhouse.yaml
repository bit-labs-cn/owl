# ClickHouse 客户端配置

# 多地址时写 addrs（推荐），与 host/port 二选一
# addrs:
#   - "127.0.0.1:9123"

host: 127.0.0.1
port: 9123

# 协议: native（默认 TCP 9000/9440）或 http（8123/8443 等，由地址与 TLS 决定）
protocol: native

auth:
  database: default
  username: default
  password: ""

# 多节点时选点策略: in_order | round_robin | random
conn-open-strategy: in_order

tls:
  enabled: false
  insecure-skip-verify: false
  server-name: ""
  # 最低 TLS 版本: 1.2 或 1.3
  min-version: ""
  ca-file: ""
  cert-file: ""
  key-file: ""

compression:
  # none | lz4 | lz4hc | zstd | gzip | deflate | br
  method: none
  level: 0

# 秒
dial-timeout: 30
read-timeout: 300

# 0 表示使用驱动默认
max-open-conns: 0
max-idle-conns: 0
# 秒
conn-max-lifetime: 3600

block-buffer-size: 0
max-compression-buffer: 0
free-buf-on-conn-release: false

# 仅 HTTP 协议时常见
http-url-path: ""
http-headers: {}
http-max-conns-per-host: 0
http-proxy-url: ""

# 会话级设置，会传入驱动 Options.Settings（按需取消注释）
settings: {}

# 客户端标识（可选）
client-info:
  products: []
  comment: []

# 启动时是否 Ping；关闭时无 ClickHouse 也能启动（仅生成配置本地开发）
health-check:
  enabled: false
  timeout-seconds: 5
